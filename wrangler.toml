name = "marriage"
main = "worker.js"
compatibility_date = "2026-11-03"

[vars]
ALLOWED_ORIGINS = "https://mattiaafanti.github.io,http://127.0.0.1:8000,http://localhost:8000"
PUBLIC_SITE_URL = "https://mattiaafanti.github.io/Marriage/"

[[d1_databases]]
binding = "DB"
database_name = "mattia-kirsten-wedding"
database_id = "029babbd-b923-4f6f-b83b-095c6a912d32"

# Hibernatable WebSocket room for immediate RSVP admin updates.
# SQLite-backed Durable Objects also work on Cloudflare Workers Free.
[[durable_objects.bindings]]
name = "RSVP_LIVE"
class_name = "RSVPUpdates"

[[migrations]]
tag = "rsvp-live-sqlite-v1"
new_sqlite_classes = ["RSVPUpdates"]

[observability.logs]
enabled = true
invocation_logs = true
